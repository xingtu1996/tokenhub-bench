# =============================================================================
# TokenHub × LiteLLM 全量网关配置
# 作用：把腾讯云 TokenHub 的 25 款模型统一暴露为 Anthropic Messages 协议，
#       让 Claude Code / 任意 Anthropic 客户端用 /model 一键切换全部模型。
#
# 前置：
#   1) pip install 'litellm[proxy]'
#   2) 导出环境变量（务必用环境变量，别把真实 Key 写进文件/仓库）：
#        export TOKENHUB_API_KEY="你的TokenHub_API_Key"
#        export LITELLM_MASTER_KEY="自己随便写一段强随机串，例如 openssl rand -hex 16"
#   3) 启动： litellm --config tokenhub_litellm_config.yaml --port 4000
#   4) Claude Code 指向网关：
#        export ANTHROPIC_BASE_URL="http://localhost:4000"
#        export ANTHROPIC_AUTH_TOKEN="$LITELLM_MASTER_KEY"
#        export ANTHROPIC_API_KEY=""          # 必须清空，防回退官方
#        claude --model hy3
#
# ⚠️ 模型名核对：api_name 列基于官方文档推断。凡标 [核对] 的，请到
#    TokenHub 控制台「API 调用」页复制真实 model 字符串后替换，避免 404。
# =============================================================================

model_list:
  # ---- 腾讯混元 Hy ----
  - model_name: hy3
    litellm_params:
      model: openai/hy3
      api_base: https://tokenhub.tencentmaas.com/v1
